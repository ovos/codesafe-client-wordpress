<svg xmlns="http://www.w3.org/2000/svg" width="940" height="150" viewBox="0 0 940 150" font-family="Rajdhani, Segoe UI, Helvetica, Arial, sans-serif">
	<defs>
		<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="1" fill="#ffffff" opacity="0.018"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="4" result="halo"/>
			<feComponentTransfer in="halo" result="dim">
				<feFuncA type="linear" slope="0.45"/>
			</feComponentTransfer>
			<feMerge>
				<feMergeNode in="dim"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<!-- plate: the app's exact canvas -->
	<path d="M12,0 H928 L940,12 V138 L928,150 H12 L0,138 V12 Z" fill="#0a0a0f"/>
	<path d="M12,0 H928 L940,12 V138 L928,150 H12 L0,138 V12 Z" fill="url(#scan)"/>
	<path d="M12,0.5 H928 L939.5,12 V138 L928,149.5 H12 L0.5,138 V12 Z"
		fill="none" stroke="#2a2e3a" stroke-width="1"/>

	<!-- accent traces on the chamfers: the yellow + cyan pair -->
	<path d="M0.5,60 V12 L12,0.5 H72" fill="none" stroke="#fcee0a" stroke-width="1.5"/>
	<path d="M939.5,90 V138 L928,149.5 H868" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>

	<!-- eyebrow -->
	<text x="40" y="44" font-size="11" font-weight="600" letter-spacing="5"
		fill="#7a7f92">OVOS</text>
	<rect x="116" y="35" width="1" height="10" fill="#2a2e3a"/>
	<text x="130" y="44" font-size="11" font-weight="600" letter-spacing="5"
		fill="#00f0ff" opacity="0.8">ERROR CONSOLE</text>

	<!-- wordmark: the app's own topbar mark - CON yellow, SOLE cyan,
		both glowing (.topbar-logo: uppercase, .14em tracking) -->
	<g font-size="46" font-weight="700" letter-spacing="6">
		<text x="38" y="97" fill="#fcee0a" filter="url(#glow)">CON</text>
		<text x="160" y="97" fill="#00f0ff" filter="url(#glow)">SOLE</text>
	</g>

	<!-- the plugin tag: a bordered chip after the wordmark -->
	<g transform="translate(342,66)">
		<path d="M4,0 H136 L140,4 V26 L136,30 H4 L0,26 V4 Z"
			fill="none" stroke="#2a2e3a" stroke-width="1"/>
		<text x="70" y="20" font-size="12" font-weight="600" letter-spacing="3"
			text-anchor="middle" fill="#7a7f92">WORDPRESS</text>
	</g>

	<!-- baseline rule, stepped like a circuit trace -->
	<path d="M38,112 H360 l6,6 H560" fill="none" stroke="#2a2e3a" stroke-width="1"/>
	<path d="M38,112 H120" fill="none" stroke="#00f0ff" stroke-width="2"/>

	<!-- subline -->
	<text x="38" y="134" font-size="11.5" letter-spacing="1.5" fill="#7a7f92"
		font-family="Consolas, 'Courier New', monospace">php errors / browser js / traffic rollups / security events / inventory</text>

	<!-- the app's fingerprint: the priority scale 0..7 -->
	<g transform="translate(778,126)">
		<rect x="0" y="0" width="14" height="5" fill="#ff003c"/>
		<rect x="17" y="0" width="14" height="5" fill="#ff2e55"/>
		<rect x="34" y="0" width="14" height="5" fill="#ff5e3a"/>
		<rect x="51" y="0" width="14" height="5" fill="#ff9e2c"/>
		<rect x="68" y="0" width="14" height="5" fill="#fcee0a"/>
		<rect x="85" y="0" width="14" height="5" fill="#00f0ff"/>
		<rect x="102" y="0" width="14" height="5" fill="#3aa0b8"/>
		<rect x="119" y="0" width="14" height="5" fill="#5a5f72"/>
	</g>
	<text x="910" y="114" font-size="9" letter-spacing="2" fill="#4a4f60"
		text-anchor="end" font-family="Consolas, 'Courier New', monospace">PRIO 0-7</text>
</svg>
